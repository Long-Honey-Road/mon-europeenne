name: buddy

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buddy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buddy}
      POSTGRES_DB: ${POSTGRES_DB:-buddy}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.12-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: ../backend
    image: buddy-backend:local
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: &database_url postgres://${POSTGRES_USER:-buddy}:${POSTGRES_PASSWORD:-buddy}@postgres:5432/${POSTGRES_DB:-buddy}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: buddy-backend:local
    command: ["seed"]
    environment:
      DATABASE_URL: *database_url
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    image: buddy-backend:local
    command: ["api"]
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: *database_url
      REDIS_ADDR: redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in deploy/.env, see deploy/.env.example}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    image: buddy-backend:local
    command: ["worker"]
    environment:
      DATABASE_URL: *database_url
      REDIS_ADDR: redis:6379
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compat}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-qwen3.6:35b-a3b}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-none}
    # Lets the container reach Ollama on the host on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
