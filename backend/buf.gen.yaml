version: v2
clean: true
managed:
  enabled: true
  disable:
    - path: google
  override:
    - file_option: go_package_prefix
      value: github.com/Long-Honey-Road/mon-europeenne/backend/gen
inputs:
  - directory: api/proto
plugins:
  - local: [go, tool, -modfile=tools.mod, protoc-gen-go]
    out: gen
    opt: paths=source_relative
  - local: [go, tool, -modfile=tools.mod, protoc-gen-go-grpc]
    out: gen
    opt: paths=source_relative
  - local: [go, tool, -modfile=tools.mod, protoc-gen-grpc-gateway]
    out: gen
    opt: paths=source_relative
  - local: [go, tool, -modfile=tools.mod, protoc-gen-openapi]
    out: api/openapi
    strategy: all
    opt:
      - naming=json
      - enum_type=string
      - title=AI-buddy API
      - version=0.1.0
