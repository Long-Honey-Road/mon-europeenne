        get:
            tags:
                - PlanService
            operationId: PlanService_GetPlan
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetPlanResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/private/plan/items/{item_id}:
        patch:
            tags:
                - PlanService
            description: UpdatePlanItem sets the status of one item; items outside the caller's plan are NOT_FOUND.
            operationId: PlanService_UpdatePlanItem
            parameters:
                - name: item_id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdatePlanItemRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdatePlanItemResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/private/threads:
        get:
            tags:
                - ThreadService
