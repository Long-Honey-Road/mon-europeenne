            operationId: ThreadService_SendMessage
            parameters:
                - name: thread_id
                  in: path
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SendMessageRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SendMessageResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/private/today:
        get:
            tags:
                - PlanService
            description: 'GetToday is the "today" panel: day of onboarding, current stage, next steps and blockers.'
            operationId: PlanService_GetToday
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetTodayResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/public/auth/login:
        post:
            tags:
                - AuthService
            operationId: AuthService_Login
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/LoginResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
components:
    schemas:
        Blocker:
            type: object
            properties:
                kind:
                    type: string
                    description: '"plan_item" for now; access requests come with S-02.'
                id:
                    type: string
                title:
                    type: string
                reason:
                    type: string
        CreateThreadRequest:
            type: object
            properties:
                type:
                    enum:
                        - THREAD_TYPE_UNSPECIFIED
                        - THREAD_TYPE_GENERAL
                        - THREAD_TYPE_PLAN
                        - THREAD_TYPE_REQUEST
                        - THREAD_TYPE_TASK
                    type: string
                    format: enum
                title:
                    type: string
                pin:
                    type: object
        CreateThreadResponse:
            type: object
            properties:
                thread:
                    $ref: '#/components/schemas/Thread'
        GetMeResponse:
            type: object
            properties:
                user:
                    $ref: '#/components/schemas/User'
                team:
                    $ref: '#/components/schemas/Team'
                relations:
                    $ref: '#/components/schemas/Relations'
        GetPersonResponse:
            type: object
            properties:
                person:
                    $ref: '#/components/schemas/Person'
        GetPlanResponse:
            type: object
            properties:
                items:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlanItem'
                    description: In period order, then by map position.
                done:
                    type: integer
                    format: int32
                total:
                    type: integer
                    format: int32
        GetThreadResponse:
            type: object
            properties:
                thread:
                    $ref: '#/components/schemas/Thread'
        GetTodayResponse:
            type: object
            properties:
                day:
                    type: integer
                    description: Calendar day since the start date, 1-based; 0 before the start.
                    format: int32
                week:
                    type: integer
                    format: int32
                period:
                    enum:
                        - PLAN_PERIOD_UNSPECIFIED
                        - PLAN_PERIOD_W1
                        - PLAN_PERIOD_W2
                        - PLAN_PERIOD_M1
                        - PLAN_PERIOD_M2
                        - PLAN_PERIOD_EQUATOR
                        - PLAN_PERIOD_FINAL
                    type: string
                    description: Earliest period with unfinished items.
                    format: enum
                next_steps:
                    type: array
                    items:
                        $ref: '#/components/schemas/PlanItem'
                    description: Up to three items to do now, in progress first.
                blockers:
                    type: array
                    items:
                        $ref: '#/components/schemas/Blocker'
                done:
                    type: integer
                    format: int32
                total:
                    type: integer
                    format: int32
        GoogleProtobufAny:
            type: object
            properties:
                '@type':
                    type: string
                    description: The type of the serialized message.
            additionalProperties: true
            description: Contains an arbitrary serialized message along with a @type that describes the type of the serialized message.
        ListMessagesResponse:
            type: object
            properties:
                messages:
                    type: array
                    items:
                        $ref: '#/components/schemas/Message'
        ListPeopleResponse:
            type: object
            properties:
                people:
                    type: array
                    items:
                        $ref: '#/components/schemas/Person'
                    description: The caller's team first, then by name.
        ListThreadsResponse:
            type: object
            properties:
                threads:
                    type: array
                    items:
                        $ref: '#/components/schemas/Thread'
        LoginRequest:
            type: object
            properties:
                login:
                    type: string
                password:
                    type: string
        LoginResponse:
            type: object
            properties:
                token:
                    type: string
                    description: 'Session token for the Authorization: Bearer header.'
                user:
                    $ref: '#/components/schemas/User'
        MapPosition:
            type: object
            properties:
                x:
                    type: number
                    format: double
                y:
                    type: number
                    format: double
                group:
                    type: string
            description: Position of an item on the plan map.
        Message:
            type: object
            properties:
                id:
                    type: string
                thread_id:
                    type: string
                role:
                    enum:
                        - MESSAGE_ROLE_UNSPECIFIED
                        - MESSAGE_ROLE_USER
                        - MESSAGE_ROLE_ASSISTANT
                    type: string
                    format: enum
                text:
                    type: string
                blocks:
                    type: array
                    items:
                        type: object
                    description: Server-built blocks of an assistant message (sources, person, not_found, ...).
                created_at:
                    type: string
                    description: RFC 3339.
        Person:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                role_title:
                    type: string
                team_id:
                    type: string
                responsibilities:
                    type: array
                    items:
                        type: string
                ask_me_about:
                    type: array
                    items:
                        type: string
                contact:
                    type: string
                    description: Only for people in the caller's cluster.
                other_team:
                    type: boolean
                    description: True when the person is outside the caller's team.
        PersonRef:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                role_title:
                    type: string
            description: Short reference to a person from the directory.
        PlanItem:
            type: object
            properties:
                id:
                    type: string
                    description: Stable key, e.g. "w1-access".
                title:
                    type: string
                practice:
                    type: string
                period:
                    enum:
                        - PLAN_PERIOD_UNSPECIFIED
                        - PLAN_PERIOD_W1
                        - PLAN_PERIOD_W2
                        - PLAN_PERIOD_M1
                        - PLAN_PERIOD_M2
                        - PLAN_PERIOD_EQUATOR
                        - PLAN_PERIOD_FINAL
                    type: string
                    format: enum
                status:
                    enum:
                        - PLAN_ITEM_STATUS_UNSPECIFIED
                        - PLAN_ITEM_STATUS_TODO
                        - PLAN_ITEM_STATUS_DOING
                        - PLAN_ITEM_STATUS_BLOCKED
                        - PLAN_ITEM_STATUS_DONE
                    type: string
                    format: enum
                note:
                    type: string
                depends_on:
                    type: array
                    items:
                        type: string
                blocked_by:
                    type: array
                    items:
                        type: string
                    description: Dependencies that are not done yet.
                sources:
                    type: array
                    items:
                        type: string
                map:
                    $ref: '#/components/schemas/MapPosition'
                team_id:
                    type: string
                    description: Empty when the item is for everyone.
                direction:
                    enum:
                        - DIRECTION_UNSPECIFIED
                        - DIRECTION_BACKEND
                        - DIRECTION_FRONTEND
                        - DIRECTION_QA
                    type: string
                    format: enum
        Relations:
            type: object
            properties:
                mentor:
                    $ref: '#/components/schemas/PersonRef'
                manager:
                    $ref: '#/components/schemas/PersonRef'
                hr_bp:
                    $ref: '#/components/schemas/PersonRef'
        SendMessageRequest:
            type: object
            properties:
                thread_id:
                    type: string
                content:
                    type: string
                mode:
                    enum:
                        - ANSWER_MODE_UNSPECIFIED
                        - ANSWER_MODE_BRIEF
                        - ANSWER_MODE_DETAILED
                    type: string
                    format: enum
        SendMessageResponse:
            type: object
            properties:
                message_id:
                    type: string
                job_id:
                    type: string
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        Team:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                unit:
                    type: string
                cluster:
                    type: string
                mattermost_channel:
                    type: string
        Thread:
            type: object
            properties:
                id:
                    type: string
                type:
                    enum:
                        - THREAD_TYPE_UNSPECIFIED
                        - THREAD_TYPE_GENERAL
                        - THREAD_TYPE_PLAN
                        - THREAD_TYPE_REQUEST
                        - THREAD_TYPE_TASK
                    type: string
                    format: enum
                title:
                    type: string
                pin:
                    type: object
                    description: 'Pinned context: {plan_item_id} or {request_id} or {task: {key, title, repo}}.'
                created_at:
                    type: string
                    description: RFC 3339.
        UpdatePlanItemRequest:
            type: object
            properties:
                item_id:
                    type: string
                status:
                    enum:
                        - PLAN_ITEM_STATUS_UNSPECIFIED
                        - PLAN_ITEM_STATUS_TODO
                        - PLAN_ITEM_STATUS_DOING
                        - PLAN_ITEM_STATUS_BLOCKED
                        - PLAN_ITEM_STATUS_DONE
                    type: string
                    format: enum
                note:
                    type: string
        UpdatePlanItemResponse:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/PlanItem'
        User:
            type: object
            properties:
                id:
                    type: string
                login:
                    type: string
                display_name:
                    type: string
                role:
                    enum:
                        - ROLE_UNSPECIFIED
                        - ROLE_INTERN
                        - ROLE_MENTOR
                        - ROLE_MANAGER
                        - ROLE_HR_BP
                        - ROLE_HR_ADMIN
                    type: string
                    format: enum
                direction:
                    enum:
                        - DIRECTION_UNSPECIFIED
                        - DIRECTION_BACKEND
                        - DIRECTION_FRONTEND
                        - DIRECTION_QA
                    type: string
                    format: enum
                team_id:
                    type: string
                repos:
                    type: array
                    items:
                        type: string
                jira_projects:
                    type: array
                    items:
                        type: string
                location:
                    type: string
                start_date:
                    type: string
                    description: ISO 8601 date, e.g. 2026-11-09.
tags:
    - name: AuthService
      description: AuthService signs in test accounts; real auth is assumed to exist at Avito.
    - name: PeopleService
      description: PeopleService is the company directory as the caller may see it.
    - name: PlanService
      description: PlanService shows and updates the caller's own adaptation plan.
    - name: ProfileService
    - name: ThreadService
      description: ThreadService keeps the caller's conversations with buddy; answers arrive over SSE.
