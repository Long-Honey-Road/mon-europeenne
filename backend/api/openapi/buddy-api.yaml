            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListThreadsResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - ThreadService
            description: CreateThread returns the existing thread for types that are one per user (plan).
            operationId: ThreadService_CreateThread
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateThreadRequest'
                required: true
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateThreadResponse'
