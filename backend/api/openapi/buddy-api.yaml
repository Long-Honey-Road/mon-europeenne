    /v1/private/people:
        get:
            tags:
                - PeopleService
            operationId: PeopleService_ListPeople
            parameters:
                - name: q
                  in: query
                  description: Words to match in name, role, responsibilities and topics; empty lists everyone.
                  schema:
                    type: string
                - name: team_id
                  in: query
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListPeopleResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/private/people/{person_id}:
        get:
            tags:
                - PeopleService
            operationId: PeopleService_GetPerson
            parameters:
                - name: person_id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetPersonResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
