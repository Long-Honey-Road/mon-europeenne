                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/private/threads/{thread_id}:
        get:
            tags:
                - ThreadService
            operationId: ThreadService_GetThread
            parameters:
                - name: thread_id
                  in: path
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GetThreadResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
    /v1/private/threads/{thread_id}/messages:
        get:
            tags:
                - ThreadService
            operationId: ThreadService_ListMessages
            parameters:
                - name: thread_id
                  in: path
                  required: true
                  schema:
                    type: string
                - name: limit
                  in: query
                  description: Last N messages, oldest first; default 50, at most 200.
                  schema:
                    type: integer
                    format: int32
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ListMessagesResponse'
                default:
                    description: Default error response
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Status'
        post:
            tags:
                - ThreadService
            description: |-
                SendMessage saves the message and queues the agent turn; answers 202, the reply streams over
