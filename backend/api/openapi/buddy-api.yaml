info:
    title: AI-buddy API
    version: 0.1.0
paths:
    /v1/private/me:
        get:
            tags:
                - ProfileService
            description: GetMe returns the caller's profile resolved from the session.
            operationId: ProfileService_GetMe
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
