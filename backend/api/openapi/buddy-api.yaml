                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        StatusChange:
            type: object
            properties:
                at:
                    type: string
                    description: RFC 3339.
                status:
                    enum:
                        - REQUEST_STATUS_UNSPECIFIED
                        - REQUEST_STATUS_PENDING
                        - REQUEST_STATUS_APPROVED
                        - REQUEST_STATUS_REJECTED
                    type: string
                    format: enum
                by:
                    type: string
                note:
                    type: string
        SubmitRequestRequest:
            type: object
            properties:
                thread_id:
                    type: string
                    description: Thread the request came from; its status changes arrive there as request_status events.
                type_key:
                    type: string
                fields:
                    type: object
        SubmitRequestResponse:
            type: object
            properties:
                request:
                    $ref: '#/components/schemas/Request'
        Team:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                unit:
                    type: string
                cluster:
                    type: string
                mattermost_channel:
                    type: string
        Thread:
            type: object
            properties:
                id:
                    type: string
                type:
                    enum:
                        - THREAD_TYPE_UNSPECIFIED
                        - THREAD_TYPE_GENERAL
                        - THREAD_TYPE_PLAN
                        - THREAD_TYPE_REQUEST
                        - THREAD_TYPE_TASK
                    type: string
                    format: enum
                title:
                    type: string
                pin:
                    type: object
                    description: 'Pinned context: {plan_item_id} or {request_id} or {task: {key, title, repo}}.'
                created_at:
                    type: string
                    description: RFC 3339.
        UpdatePinRequest:
            type: object
            properties:
                pin_id:
                    type: string
                title:
                    type: string
                text:
                    type: string
        UpdatePinResponse:
            type: object
            properties:
                pin:
                    $ref: '#/components/schemas/Pin'
        UpdatePlanItemRequest:
            type: object
            properties:
                item_id:
                    type: string
                status:
                    enum:
                        - PLAN_ITEM_STATUS_UNSPECIFIED
                        - PLAN_ITEM_STATUS_TODO
                        - PLAN_ITEM_STATUS_DOING
                        - PLAN_ITEM_STATUS_BLOCKED
                        - PLAN_ITEM_STATUS_DONE
                    type: string
                    format: enum
                note:
                    type: string
        UpdatePlanItemResponse:
            type: object
            properties:
                item:
                    $ref: '#/components/schemas/PlanItem'
        User:
            type: object
            properties:
                id:
                    type: string
                login:
                    type: string
                display_name:
                    type: string
                role:
                    enum:
                        - ROLE_UNSPECIFIED
                        - ROLE_INTERN
                        - ROLE_MENTOR
                        - ROLE_MANAGER
                        - ROLE_HR_BP
                        - ROLE_HR_ADMIN
                    type: string
                    format: enum
                direction:
                    enum:
                        - DIRECTION_UNSPECIFIED
                        - DIRECTION_BACKEND
                        - DIRECTION_FRONTEND
                        - DIRECTION_QA
                    type: string
                    format: enum
                team_id:
                    type: string
                repos:
                    type: array
                    items:
                        type: string
                jira_projects:
                    type: array
                    items:
                        type: string
                location:
                    type: string
                start_date:
                    type: string
                    description: ISO 8601 date, e.g. 2026-11-09.
tags:
    - name: AuthService
      description: AuthService signs in test accounts; real auth is assumed to exist at Avito.
    - name: PeopleService
      description: PeopleService is the company directory as the caller may see it.
    - name: PinService
      description: PinService keeps the notes the user pinned to their spheres (design §6.5). Only the owner sees and changes them.
    - name: PlanService
      description: PlanService shows and updates the caller's own adaptation plan.
    - name: ProfileService
    - name: RequestService
      description: |-
        RequestService sends access requests the user confirmed to the company's request system and shows their
         status. A removable module behind FEATURE_REQUESTS: when it is off every method is UNIMPLEMENTED.
    - name: ThreadService
      description: ThreadService keeps the caller's conversations with buddy; answers arrive over SSE.
