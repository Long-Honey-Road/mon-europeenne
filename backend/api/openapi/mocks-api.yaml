        ListRequestsResponse:
            type: object
            properties:
                requests:
                    type: array
                    items:
                        $ref: '#/components/schemas/Request'
        ListTeamsResponse:
            type: object
            properties:
                teams:
                    type: array
                    items:
                        $ref: '#/components/schemas/Team'
        ListUpdatesResponse:
            type: object
            properties:
                requests:
                    type: array
                    items:
                        $ref: '#/components/schemas/Request'
