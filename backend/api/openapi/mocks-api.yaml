                    type: string
                    description: Version of the latest change of any request.
        Person:
            type: object
            properties:
                id:
                    type: string
                user_id:
                    type: string
                    description: Account id when the person can sign in.
                name:
                    type: string
                role_title:
                    type: string
                team_id:
                    type: string
                responsibilities:
                    type: array
                    items:
