                user_id:
                    type: string
                login:
                    type: string
                display_name:
                    type: string
                role:
                    type: string
                    description: intern, mentor, manager, hr_bp or hr_admin.
                direction:
                    type: string
                    description: backend, frontend or qa; empty when not set.
                team_id:
                    type: string
                manager_id:
                    type: string
                mentor_id:
                    type: string
                repos:
                    type: array
                    items:
                        type: string
                jira_projects:
                    type: array
                    items:
                        type: string
                location:
                    type: string
                start_date:
                    type: string
                    description: YYYY-MM-DD; empty when not set.
        Approver:
            type: object
            properties:
                role:
                    type: string
                    description: object_owner, manager, devops or hr_admin.
                person_id:
                    type: string
                name:
                    type: string
        AuthenticateRequest:
            type: object
            properties:
                login:
                    type: string
                password:
                    type: string
        AuthenticateResponse:
            type: object
            properties:
                account:
                    $ref: '#/components/schemas/Account'
        Change:
            type: object
            properties:
                at:
                    type: string
                    format: date-time
                status:
                    enum:
                        - STATUS_UNSPECIFIED
                        - STATUS_PENDING
                        - STATUS_APPROVED
                        - STATUS_REJECTED
                    type: string
                    format: enum
                by:
                    type: string
                note:
                    type: string
        DocumentInfo:
            type: object
            properties:
                id:
                    type: string
                title:
                    type: string
                team_id:
                    type: string
                    description: Empty for a general document visible to everyone.
                topic:
                    type: string
                test_instruction:
                    type: boolean
                    description: 'Always true here: the documents are training instructions, not Avito regulations.'
        GetAccountResponse:
            type: object
            properties:
                account:
                    $ref: '#/components/schemas/Account'
        GetDocumentResponse:
            type: object
            properties:
