                    $ref: '#/components/schemas/Request'
        Team:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                unit:
                    type: string
                cluster:
                    type: string
                mattermost_channel:
                    type: string
tags:
    - name: AuthRolesService
      description: |-
        AuthRolesService imitates the company's sign-in and role directory: it checks credentials and returns the
         account with its role and attributes (RBAC + ABAC). Buddy issues its own session tokens on top of it.
    - name: CorpRequestsService
      description: |-
        CorpRequestsService imitates the company's request system for access requests. Approvers decide on their
         own schedule (demo outcomes from seed); clients learn about decisions by polling ListUpdates.
    - name: DirectoryService
      description: |-
        DirectoryService imitates the company's employee directory: teams, people and who supports whom.
         Data is synthetic; no real employees.
    - name: DocumentsService
      description: |-
        DocumentsService imitates the team wiki (Confluence): general and team documents in markdown. Every document is
         a synthetic training instruction. Buddy reads it with a service account and applies team rights itself.
