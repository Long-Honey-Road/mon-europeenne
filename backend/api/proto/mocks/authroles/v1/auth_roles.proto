syntax = "proto3";

package mocks.authroles.v1;

import "google/api/annotations.proto";

// AuthRolesService imitates the company's sign-in and role directory: it checks credentials and returns the
// account with its role and attributes (RBAC + ABAC). Buddy issues its own session tokens on top of it.
service AuthRolesService {
  // Authenticate fails with UNAUTHENTICATED for an unknown login and for a wrong password alike.
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse) {
    option (google.api.http) = {
      post: "/auth/authenticate"
      body: "*"
    };
  }
  // GetAccount fails with NOT_FOUND for an unknown user.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse) {
    option (google.api.http) = {get: "/auth/accounts/{user_id}"};
  }
  // CreateAccount hires an intern into the requester's team: an account that signs in at once, a directory entry
  // with mentor, manager and HR BP, and a one-time password returned only here. Only a manager may call it;
  // PERMISSION_DENIED otherwise, INVALID_ARGUMENT for bad fields, ALREADY_EXISTS for a taken login.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse) {
    option (google.api.http) = {
      post: "/auth/accounts"
      body: "*"
    };
  }
}

message Account {
  string user_id = 1;
  string login = 2;
  string display_name = 3;
  // intern, mentor, manager, hr_bp or hr_admin.
  string role = 4;
  // backend, frontend or qa; empty when not set.
  string direction = 5;
  string team_id = 6;
  string manager_id = 7;
  string mentor_id = 8;
  repeated string repos = 9;
  repeated string jira_projects = 10;
  string location = 11;
  // YYYY-MM-DD; empty when not set.
  string start_date = 12;
}

message AuthenticateRequest {
  string login = 1;
  string password = 2;
}

message AuthenticateResponse {
  Account account = 1;
}

message GetAccountRequest {
  string user_id = 1;
}

message GetAccountResponse {
  Account account = 1;
}

message CreateAccountRequest {
  // The manager who hires; the intern joins this manager's team.
  string requester_id = 1;
  string display_name = 2;
  // Lowercase latin, 3 to 32 characters: ^[a-z][a-z0-9._-]{2,31}$.
  string login = 3;
  // backend, frontend or qa.
  string direction = 4;
  // Person id of a mentor from the same team.
  string mentor_id = 5;
  // YYYY-MM-DD; empty means today.
  string start_date = 6;
}

message CreateAccountResponse {
  Account account = 1;
  string temporary_password = 2;
}
