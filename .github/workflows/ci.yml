name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/tools.sum
      - name: Generated code is up to date
        run: make gen-check
      - name: Lint
        run: make lint
      - name: Test with coverage
        run: make cover

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start the stack
        run: |
          cp deploy/.env.example deploy/.env
          sed -i 's/^LLM_PROVIDER=.*/LLM_PROVIDER=fake/' deploy/.env
          docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 180
      - name: Smoke test login, profile and a chat turn
        run: deploy/smoke.sh http://localhost:8080
      - name: Smoke test the same through the frontend container
        run: |
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3000/some/client/route | grep -q '<div id="root">'
          deploy/smoke.sh http://localhost:3000
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v
