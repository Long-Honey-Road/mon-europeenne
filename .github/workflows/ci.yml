name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: |
            backend/go.sum
            backend/tools.sum
      - name: Generated code is up to date
        run: make gen-check
      - name: Lint
        run: make lint
      - name: Test with coverage
        run: make cover

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test with coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start the stack
        run: |
          cp deploy/.env.example deploy/.env
          sed -i 's/^LLM_PROVIDER=.*/LLM_PROVIDER=fake/' deploy/.env
          docker compose -f deploy/docker-compose.yml up -d --build --wait --wait-timeout 180
      - name: Smoke test login, profile and a chat turn
        run: deploy/smoke.sh http://localhost:8080
      - name: Smoke test the same through the frontend container
        run: |
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3000/some/client/route | grep -q '<div id="root">'
          deploy/smoke.sh http://localhost:3000
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs
      - name: Stop the stack
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  # Images for the self-hosted stacks: develop – staging, main – prod.
  # arm64 because they run on an arm64, lol; tagged by commit sha.
  images:
    if: github.event_name == 'push'
    needs: [ backend, frontend, compose ]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Registry path in lower case
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Backend image
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/buddy-backend:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/buddy-frontend:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
